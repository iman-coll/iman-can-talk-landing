<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iman Can Talk - AI Chatbot</title>
  <meta name="description" content="Iman Can Talk - an AI chatbot that answers your questions using Groq and Ollama open-source models." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f9f0ff 0%, #e6f0ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 720px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(80, 40, 140, 0.18);
    }
    .emoji { font-size: 56px; }
    h1 { font-size: 32px; margin: 16px 0 8px; color: #222; }
    p { color: #555; font-size: 17px; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      background: #7c3aed;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 34px;
      border-radius: 12px;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .btn:hover { background: #6d28d9; transform: translateY(-2px); }
    .links { margin-top: 26px; font-size: 14px; }
    .links a { color: #7c3aed; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">💬</div>
    <h1>Iman Can Talk</h1>
    <p>
      An AI chatbot that answers your questions using open-source models,
      powered by Groq in the cloud and Ollama locally. Ask anything &
mdash; and get detailed, friendly answers.
    </p>
    <a class="btn" href="https://iman-can-talk-ks68zuug3ehqtc95bq9f7k.streamlit.app/" target="_blank" rel="noopener">
      Launch Chatbot
    </a>
    <div class="links">
      <a href="https://github.com/iman-coll/Iman-can-talk" target="_blank" rel="noopener">View source on GitHub</a>
    </div>
  </div>
</body>
</html>
